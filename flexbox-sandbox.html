<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexbox Sandbox</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --green: #43d98c;
    --yellow: #ffd166;
    --text: #e2e8f0;
    --text-muted: #7b85a5;
    --font-mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header h1 { font-size: 1rem; font-weight: 700; letter-spacing: .5px; }
  header h1 span { color: var(--accent); }
  .progress-bar-wrap {
    flex: 1;
    background: var(--surface2);
    border-radius: 99px;
    height: 6px;
    overflow: hidden;
    max-width: 200px;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--green));
    border-radius: 99px;
    transition: width .4s;
  }
  .progress-label { font-size: .75rem; color: var(--text-muted); white-space: nowrap; }

  .app { display: flex; flex: 1; overflow: hidden; }

  .sidebar {
    width: 240px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
  }
  .sidebar-section { padding: 8px 0; border-bottom: 1px solid var(--border); }
  .sidebar-level {
    font-size: .65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 8px 14px 4px;
    color: var(--text-muted);
  }
  .exo-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    cursor: pointer;
    font-size: .82rem;
    line-height: 1.3;
    transition: background .15s;
    border-left: 3px solid transparent;
  }
  .exo-item:hover { background: var(--surface2); }
  .exo-item.active { background: var(--surface2); border-left-color: var(--accent); color: #fff; }
  .exo-item.done .exo-num { background: var(--green); color: #000; }
  .exo-num {
    flex-shrink: 0;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--surface2);
    font-size: .7rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted);
  }
  .exo-item.active .exo-num { background: var(--accent); color: #fff; }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  .desc-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex; align-items: flex-start; gap: 16px;
    flex-shrink: 0;
  }
  .desc-content { flex: 1; }
  .desc-content h2 { font-size: .95rem; font-weight: 700; margin-bottom: 4px; }
  .exo-badge {
    font-size: .65rem; background: var(--accent); color: #fff;
    padding: 2px 7px; border-radius: 99px; margin-right: 8px; vertical-align: middle;
  }
  .desc-content p { font-size: .82rem; color: #a0aec0; line-height: 1.5; }
  .desc-actions { display: flex; gap: 8px; flex-shrink: 0; align-items: center; }

  button {
    border: none; cursor: pointer; border-radius: 6px;
    font-size: .78rem; font-weight: 600; padding: 6px 12px;
    transition: opacity .15s, transform .1s;
  }
  button:hover { opacity: .85; transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  .btn-hint { background: var(--surface2); color: var(--yellow); border: 1px solid var(--border); }
  .btn-solution { background: var(--surface2); color: var(--accent2); border: 1px solid var(--border); }
  .btn-check { background: var(--surface2); color: #4fc3f7; border: 1px solid var(--border); }
  .btn-explain { background: var(--surface2); color: #a78bfa; border: 1px solid var(--border); }
  .btn-reset { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
  .btn-done { background: var(--green); color: #000; }
  .btn-nav { background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted); padding: 6px 10px; }

  .hint-panel {
    background: #1a1a2e; border-bottom: 1px solid var(--border);
    padding: 10px 20px; font-size: .8rem; color: var(--yellow);
    display: none; line-height: 1.6;
  }
  .hint-panel.visible { display: block; }
  .hint-panel code {
    background: var(--surface2); padding: 1px 5px; border-radius: 4px;
    font-family: var(--font-mono); font-size: .78rem; color: #c792ea;
  }

  .check-panel {
    background: #0d1117; border-bottom: 1px solid var(--border);
    padding: 10px 20px; font-size: .8rem;
    display: none; line-height: 1.8;
  }
  .check-panel.visible { display: block; }
  .check-ok { color: var(--green); font-weight: 600; }
  .check-err { color: var(--accent2); }
  .check-summary { font-weight: 700; margin-bottom: 6px; }
  .check-panel code {
    background: var(--surface2); padding: 1px 5px; border-radius: 4px;
    font-family: var(--font-mono); font-size: .78rem; color: #c792ea;
  }

  .explain-panel {
    background: #13102a; border-bottom: 1px solid var(--border);
    padding: 12px 20px; font-size: .82rem; color: #c4b5fd;
    display: none; line-height: 1.9;
  }
  .explain-panel.visible { display: block; }
  .explain-panel strong { color: #e9d5ff; }
  .explain-panel em { color: #a78bfa; font-style: normal; font-weight: 600; }
  .explain-panel code {
    background: var(--surface2); padding: 1px 5px; border-radius: 4px;
    font-family: var(--font-mono); font-size: .78rem; color: #7dd3fc;
  }
  .explain-panel .prop-line { margin-bottom: 2px; }
  .explain-note {
    margin-top: 8px; padding: 6px 10px;
    background: #1e1645; border-left: 3px solid #7c3aed;
    border-radius: 0 4px 4px 0; font-size: .78rem; color: #a78bfa;
  }

  .workspace { flex: 1; display: flex; overflow: hidden; }

  .editor-pane {
    width: 45%; flex-shrink: 0;
    display: flex; flex-direction: column;
    border-right: 1px solid var(--border);
  }
  .tabs {
    display: flex; background: var(--surface);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .tab {
    padding: 8px 16px; font-size: .78rem; font-weight: 600;
    cursor: pointer; color: var(--text-muted);
    border-bottom: 2px solid transparent; transition: color .15s;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-hint {
    font-size: .65rem; color: var(--text-muted);
    padding: 8px 12px 8px 0; margin-left: auto; font-style: italic;
  }
  .editor-wrap { flex: 1; overflow: hidden; }
  textarea {
    width: 100%; height: 100%;
    background: #0d1117; color: #e2e8f0;
    border: none; padding: 14px 16px;
    font-family: var(--font-mono); font-size: .82rem; line-height: 1.6;
    resize: none; outline: none; tab-size: 2;
  }

  .preview-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .preview-header {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; background: var(--surface);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .preview-dot { width: 10px; height: 10px; border-radius: 50%; }
  .preview-header span { font-size: .72rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
  .btn-run { margin-left: auto; background: var(--accent); color: #fff; padding: 5px 14px; }
  iframe { flex: 1; border: none; background: #fff; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  @media print {
    body > *:not(#cheatOverlay) { display: none !important; }
    #cheatOverlay { display: block !important; position: static !important; background: #fff !important; color: #000 !important; overflow: visible !important; height: auto !important; }
    .cheat-inner { overflow: visible !important; height: auto !important; }
    .cheat-header { position: static !important; background: #fff !important; border-bottom: 2px solid #000 !important; }
    .btn-close-cheat { display: none !important; }
    .cheat-h2 { color: #000 !important; border-color: #000 !important; }
    .cheat-h2::before { background: #000 !important; }
    .cheat-table th { background: #eee !important; color: #000 !important; }
    .cheat-table td { color: #222 !important; border-color: #ddd !important; }
    .ct-prop { color: #3730a3 !important; }
    .ct-vals code, .ft-exp code, code { background: #f0f0f0 !important; color: #c2410c !important; }
    .vis-track { background: #f5f5f5 !important; border-color: #ccc !important; }
    .vis-box:nth-child(1) { background: #6c63ff !important; }
    .vis-box:nth-child(2) { background: #a78bfa !important; }
    .vis-box:nth-child(3) { background: #4fc3f7 !important; }
    .pattern-card { background: #f9f9f9 !important; border-color: #ddd !important; break-inside: avoid; }
    .gotcha-card { background: #fff5f5 !important; border-color: #fca5a5 !important; break-inside: avoid; }
    .gotcha-title { color: #dc2626 !important; }
    .pattern-title { color: #16a34a !important; }
    .pc { color: #0369a1 !important; }
    .vc { color: #b45309 !important; }
    .sc { color: #be185d !important; }
    .axis-wrap { background: #f5f5f5 !important; border-color: #ccc !important; }
    .tag-cont { background: #ede9fe !important; color: #5b21b6 !important; border-color: #8b5cf6 !important; }
    .tag-item { background: #dcfce7 !important; color: #15803d !important; border-color: #4ade80 !important; }
    .cheat-section { break-inside: avoid; page-break-inside: avoid; }
    .ft-short { color: #92400e !important; }
  }

  /* ─── ANIMATIONS ─── */
  @keyframes fadeIn  { from{opacity:0}       to{opacity:1} }
  @keyframes cardPop { from{transform:scale(.35);opacity:0} to{transform:scale(1);opacity:1} }
  @keyframes trophyFloat { 0%,100%{transform:translateY(0) rotate(-7deg)} 50%{transform:translateY(-16px) rotate(7deg)} }
  @keyframes shimmer { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
  @keyframes starPop { from{transform:scale(0);opacity:0} 60%{transform:scale(1.3)} to{transform:scale(1);opacity:1} }

  /* ─── CELEBRATION ─── */
  #celebOverlay {
    position:fixed;inset:0;z-index:9000;display:flex;
    align-items:center;justify-content:center;
    background:rgba(0,0,0,.78);backdrop-filter:blur(8px);
    animation:fadeIn .3s;
  }
  #confettiCanvas { position:fixed;inset:0;pointer-events:none;z-index:9001; }
  .celeb-card {
    position:relative;z-index:9002;
    background:linear-gradient(145deg,#1a1d27,#13102a);
    border:1px solid rgba(108,99,255,.55);border-radius:22px;
    padding:42px 36px;text-align:center;max-width:460px;width:92%;
    box-shadow:0 0 80px rgba(108,99,255,.28),0 0 160px rgba(108,99,255,.12);
    animation:cardPop .45s cubic-bezier(.175,.885,.32,1.275);
  }
  .celeb-stars { display:flex;justify-content:center;gap:8px;margin-bottom:6px; }
  .celeb-star  { font-size:1.4rem;animation:starPop .4s cubic-bezier(.175,.885,.32,1.275) both; }
  .celeb-star:nth-child(1){animation-delay:.1s}
  .celeb-star:nth-child(2){animation-delay:.22s}
  .celeb-star:nth-child(3){animation-delay:.34s}
  .celeb-trophy { font-size:5rem;line-height:1;display:inline-block;animation:trophyFloat 2.2s ease-in-out infinite;margin-bottom:10px; }
  .celeb-title {
    font-size:1.55rem;font-weight:900;letter-spacing:2.5px;text-transform:uppercase;margin:6px 0 2px;
    background:linear-gradient(90deg,#a78bfa,#6c63ff,#4fc3f7,#a78bfa);background-size:300% 300%;
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    animation:shimmer 3s ease infinite;
  }
  .celeb-sub { color:#7b85a5;font-size:.83rem;margin-bottom:18px;line-height:1.6; }
  .celeb-stats { display:flex;gap:10px;justify-content:center;margin:18px 0; }
  .celeb-stat { background:rgba(108,99,255,.12);border:1px solid rgba(108,99,255,.3);border-radius:10px;padding:12px 16px;flex:1; }
  .celeb-stat .num { font-size:1.7rem;font-weight:900;color:#a78bfa;display:block; }
  .celeb-stat .lbl { font-size:.6rem;color:#7b85a5;text-transform:uppercase;letter-spacing:1px; }
  .celeb-btns { display:flex;flex-direction:column;gap:10px;margin-top:24px; }
  .btn-open-synth {
    background:linear-gradient(90deg,#6c63ff,#a78bfa);color:#fff;border:none;border-radius:10px;
    padding:13px 20px;font-size:.9rem;font-weight:700;cursor:pointer;letter-spacing:.5px;
    transition:transform .15s,box-shadow .15s;
  }
  .btn-open-synth:hover { transform:translateY(-2px);box-shadow:0 10px 30px rgba(108,99,255,.45); }
  .btn-celeb-close { background:transparent;color:#7b85a5;border:1px solid #2e3350;border-radius:10px;padding:10px;font-size:.82rem;cursor:pointer; }
  .btn-celeb-close:hover { color:#e2e8f0;border-color:#7b85a5; }
  .btn-hdr-synth {
    background:linear-gradient(90deg,#6c63ff,#a78bfa);color:#fff;border:none;border-radius:6px;
    font-size:.7rem;font-weight:700;padding:5px 12px;cursor:pointer;letter-spacing:.5px;
    display:none;transition:opacity .15s,transform .15s;
  }
  .btn-hdr-synth:hover { opacity:.85;transform:translateY(-1px); }

  /* ─── CHEAT SHEET ─── */
  #cheatOverlay {
    position:fixed;inset:0;z-index:9500;background:#0a0d14;
    overflow-y:auto;animation:fadeIn .25s;display:none;
  }
  #cheatOverlay.open { display:block; }
  .cheat-inner { max-width:1080px;margin:0 auto;padding:0 24px 80px; }
  .cheat-header {
    position:sticky;top:0;z-index:10;background:#0a0d14;
    border-bottom:1px solid #2e3350;padding:14px 0;
    display:flex;align-items:center;justify-content:space-between;margin-bottom:40px;
  }
  .cheat-header h1 { font-size:1rem;font-weight:800;color:#e2e8f0;letter-spacing:.5px; }
  .cheat-header h1 em { font-style:normal;color:#6c63ff; }
  .btn-close-cheat { background:#1a1d27;border:1px solid #2e3350;color:#7b85a5;border-radius:6px;padding:6px 16px;font-size:.78rem;font-weight:600;cursor:pointer; }
  .btn-close-cheat:hover { color:#e2e8f0;border-color:#7b85a5; }
  .cheat-cols { display:grid;grid-template-columns:1fr 1fr;gap:24px; }
  @media(max-width:680px){ .cheat-cols{grid-template-columns:1fr} }
  .cheat-section { margin-bottom:52px; }
  .cheat-h2 {
    font-size:.7rem;font-weight:800;letter-spacing:2px;text-transform:uppercase;
    color:#6c63ff;border-bottom:1px solid #2e3350;padding-bottom:8px;margin-bottom:20px;
    display:flex;align-items:center;gap:8px;
  }
  .cheat-h2::before { content:'';flex:none;width:3px;height:14px;background:#6c63ff;border-radius:2px; }
  .cheat-table { width:100%;border-collapse:collapse;font-size:.8rem; }
  .cheat-table th { text-align:left;padding:7px 10px;background:#1a1d27;color:#7b85a5;font-size:.63rem;text-transform:uppercase;letter-spacing:1px;font-weight:700;border-bottom:1px solid #2e3350; }
  .cheat-table td { padding:8px 10px;border-bottom:1px solid #151825;vertical-align:top;color:#c4cde8;line-height:1.6; }
  .cheat-table tr:hover td { background:#1a1d27; }
  .ct-prop { color:#a78bfa;font-family:var(--font-mono);font-weight:600;white-space:nowrap; }
  .ct-vals code { font-family:var(--font-mono);font-size:.74rem;color:#7dd3fc;background:#1e2235;padding:1px 4px;border-radius:3px;white-space:nowrap; }
  .ct-default { font-size:.67rem;color:#43d98c;font-style:italic;margin-top:2px; }
  .ct-desc { color:#9aa3be;font-size:.78rem; }
  .vis-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px; }
  .vis-item { background:#1a1d27;border:1px solid #2e3350;border-radius:8px;padding:10px; }
  .vis-label { font-family:var(--font-mono);font-size:.7rem;color:#a78bfa;margin-bottom:7px;font-weight:600; }
  .vis-track { background:#0d1117;border:1px solid #2e3350;border-radius:4px;height:42px;display:flex;align-items:center;padding:4px; }
  .vis-track.col { flex-direction:column;height:100px;width:42px;align-items:stretch;padding:4px; }
  .vis-box { width:22px;height:28px;border-radius:3px;flex-shrink:0; }
  .vis-box.s { height:18px; }
  .vis-box.t { height:36px; }
  .vis-box:nth-child(1){background:#6c63ff}
  .vis-box:nth-child(2){background:#a78bfa}
  .vis-box:nth-child(3){background:#4fc3f7}
  .pattern-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px; }
  .pattern-card { background:#1a1d27;border:1px solid #2e3350;border-radius:10px;padding:16px; }
  .pattern-title { font-size:.8rem;font-weight:700;color:#43d98c;margin-bottom:3px; }
  .pattern-use { font-size:.7rem;color:#7b85a5;font-style:italic;margin-bottom:10px; }
  .pattern-code { font-family:var(--font-mono);font-size:.73rem;color:#c4cde8;line-height:1.8;white-space:pre; }
  .pc{color:#7dd3fc}.vc{color:#ffd166}.sc{color:#ff6584}.cm{color:#556070;font-style:italic}
  .gotcha-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px; }
  .gotcha-card { background:rgba(255,101,132,.07);border:1px solid rgba(255,101,132,.22);border-radius:8px;padding:14px; }
  .gotcha-title { color:#ff6584;font-weight:700;font-size:.8rem;margin-bottom:6px; }
  .gotcha-card p { font-size:.77rem;color:#a0aec0;line-height:1.65;margin:4px 0; }
  .gotcha-card code { font-family:var(--font-mono);font-size:.72rem;color:#7dd3fc;background:#1e2235;padding:1px 4px;border-radius:3px; }
  .flex-table { width:100%;border-collapse:collapse;font-size:.8rem; }
  .flex-table th { background:#1a1d27;color:#7b85a5;padding:7px 10px;text-align:left;font-size:.63rem;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid #2e3350; }
  .flex-table td { padding:8px 10px;border-bottom:1px solid #151825;vertical-align:middle; }
  .flex-table tr:hover td { background:#1a1d27; }
  .ft-short{color:#ffd166;font-family:var(--font-mono);font-weight:600}
  .ft-exp{color:#9aa3be;font-size:.73rem}
  .ft-exp code{font-family:var(--font-mono);color:#7dd3fc;background:#1e2235;padding:1px 4px;border-radius:3px}
  .ft-note{color:#a0aec0;font-size:.75rem}
  .axis-wrap { background:#1a1d27;border:1px solid #2e3350;border-radius:10px;padding:24px;display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start; }
  .axis-diagram { position:relative;width:200px;height:120px;border:2px dashed #2e3350;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center; }
  .axis-arrow-h { position:absolute;bottom:-26px;left:0;right:0;display:flex;align-items:center;justify-content:space-between;font-size:.68rem;font-weight:700;color:#6c63ff; }
  .axis-arrow-v { position:absolute;right:-66px;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:.68rem;font-weight:700;color:#ff6584; }
  .axis-note { font-size:.75rem;color:#9aa3be;line-height:1.8;flex:1;min-width:200px; }
  .axis-note strong { color:#e2e8f0; }
  .axis-center { font-size:.65rem;color:#7b85a5;text-align:center; }
  .tag-row { display:flex;flex-wrap:wrap;gap:6px;margin-top:8px; }
  .tag { font-size:.68rem;padding:2px 8px;border-radius:99px;font-weight:600; }
  .tag-cont { background:rgba(108,99,255,.18);color:#a78bfa;border:1px solid rgba(108,99,255,.3); }
  .tag-item { background:rgba(67,217,140,.15);color:#43d98c;border:1px solid rgba(67,217,140,.3); }
</style>
</head>
<body>

<header>
  <h1>Flex<span>box</span> Sandbox</h1>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
  </div>
  <span class="progress-label" id="progressLabel">0 / 20</span>
</header>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <div class="desc-bar">
      <div class="desc-content">
        <h2><span class="exo-badge" id="exoBadge"></span><span id="exoTitle"></span></h2>
        <p id="exoDesc"></p>
      </div>
      <div class="desc-actions">
        <button class="btn-nav" id="btnPrev" onclick="navigate(-1)">&#9664;</button>
        <button class="btn-hint" onclick="toggleHint()">Indice</button>
        <button class="btn-solution" onclick="showSolution()">Solution</button>
        <button class="btn-check" onclick="checkAnswer()">&#10003; Verifier</button>

var EXPLAIN = [

  // 01 — Centrer un bloc
  '<div class="prop-line"><code>display: flex</code> — active Flexbox sur le conteneur. Ses enfants deviennent des <em>flex items</em>. Par d\u00e9faut ils s\u2019alignent en ligne (gauche \u2192 droite).</div>'
  +'<div class="prop-line"><code>justify-content: center</code> — centre les items sur l\u2019axe <strong>principal</strong> (horizontal ici).</div>'
  +'<div class="prop-line"><code>align-items: center</code> — centre les items sur l\u2019axe <strong>secondaire</strong> (vertical ici).</div>'
  +'<div class="explain-note">Ces deux propri\u00e9t\u00e9s ensemble = centrage parfait dans les deux directions. C\u2019est le combo le plus utilis\u00e9 en Flexbox.</div>',

  // 02 — 3 \u00e9l\u00e9ments en ligne, \u00e0 gauche
  '<div class="prop-line"><code>display: flex</code> — par d\u00e9faut <code>flex-direction: row</code>, les 3 bo\u00eetes se placent automatiquement en ligne de gauche \u00e0 droite.</div>'
  +'<div class="prop-line"><code>align-items: flex-start</code> — aligne les items <strong>en haut</strong> du conteneur. Sans \u00e7a, la valeur par d\u00e9faut <code>stretch</code> \u00e9tirerait chaque bo\u00eete sur toute la hauteur.</div>'
  +'<div class="prop-line"><code>gap: 12px</code> — espace uniforme entre les items, sans <code>margin</code>. Avantage\u00a0: pas d\u2019espace avant le premier ni apr\u00e8s le dernier item.</div>'
  +'<div class="explain-note">&#9888; <code>align-items: left</code> n\u2019est <strong>pas une valeur valide</strong> pour Flexbox. Le navigateur l\u2019ignore et applique <code>stretch</code> (d\u00e9faut). Il faut utiliser <code>flex-start</code>.</div>',

  // 03 — Espace \u00e9gal entre 3 \u00e9l\u00e9ments
  '<div class="prop-line"><code>display: flex</code> — les \u00e9l\u00e9ments se mettent en ligne.</div>'
  +'<div class="prop-line"><code>justify-content: space-between</code> — distribue l\u2019espace entre les items\u00a0: 1er coll\u00e9 \u00e0 gauche, dernier coll\u00e9 \u00e0 droite, espace restant r\u00e9parti \u00e9galement entre eux.</div>'
  +'<div class="explain-note">Alternatives utiles\u00a0:<br><code>space-around</code> — espace \u00e9gal autour de chaque item (bords = moiti\u00e9 de l\u2019espace int\u00e9rieur)<br><code>space-evenly</code> — espace identique partout, y compris aux bords</div>',

  // 04 — 3 \u00e9l\u00e9ments en colonne
  '<div class="prop-line"><code>display: flex</code> — active Flexbox.</div>'
  +'<div class="prop-line"><code>flex-direction: column</code> — change l\u2019axe principal de <strong>horizontal \u2192 vertical</strong>. Les items s\u2019empilent les uns sous les autres.</div>'
  +'<div class="prop-line"><code>gap: 12px</code> — espace vertical entre chaque item.</div>'
  +'<div class="explain-note">&#9888; Quand <code>flex-direction: column</code>, les r\u00f4les s\u2019inversent\u00a0: <code>justify-content</code> agit sur le <strong>vertical</strong> et <code>align-items</code> sur l\u2019<strong>horizontal</strong>.</div>',

  // 05 — Centrage parfait
  '<div class="prop-line"><code>display: flex</code> + <code>flex-direction: column</code> — axe principal = vertical. Le titre et le bouton s\u2019empilent.</div>'
  +'<div class="prop-line"><code>justify-content: center</code> — centre sur l\u2019axe <strong>vertical</strong> (car direction = column).</div>'
  +'<div class="prop-line"><code>align-items: center</code> — centre sur l\u2019axe <strong>horizontal</strong>.</div>'
  +'<div class="explain-note">C\u2019est la technique standard pour une page d\u2019accueil ou un \u00e9cran de connexion centr\u00e9 (hero section, login page\u2026).</div>',

  // 06 — Barre de navigation

  // 07 — Header avec bouton \u00e0 droite

// ── STATE ──
var cur = 0;
var done = (function() {
  try { return JSON.parse(localStorage.getItem('fb-done') || '[]'); } catch(e) { return []; }
})();
var activeTab = 'html';
var hintVisible = false;
var runTimer = null;

// ── CORE ──
function init() {
  buildModals();
  // Si d\u00e9j\u00e0 tout compl\u00e9t\u00e9 (rechargement de page), afficher le bouton synth\u00e8se
  if (done.length === EX.length) {
    var btn = document.getElementById('btnHdrSynth');
    if (btn) btn.style.display = '';
  }
  // Purge les entrées CSS vides laissées par une ancienne version
  for (var k = 0; k < EX.length; k++) {
    try {
      var v = localStorage.getItem('fb-ex-' + k);
      if (v) {
        var p = JSON.parse(v);
        if (p.css === '') localStorage.removeItem('fb-ex-' + k);
      }
    } catch(e) {}
  }
  buildSidebar();
  loadEx(0);
}

function buildSidebar() {
  var sb = document.getElementById('sidebar');
  sb.innerHTML = '';
  var levels = [
    { lv:1, label:'Niveau 1 - Bases', r:[0,4] },
    { lv:2, label:'Niveau 2 - Alignement', r:[5,9] },
    { lv:3, label:'Niveau 3 - Repartition', r:[10,14] },
    { lv:4, label:'Niveau 4 - Wrap & Responsive', r:[15,19] }
  ];
  levels.forEach(function(lv) {
    var sec = document.createElement('div');
    sec.className = 'sidebar-section';
    var lbl = document.createElement('div');
    lbl.className = 'sidebar-level';
    lbl.textContent = lv.label;
    sec.appendChild(lbl);
    for (var i = lv.r[0]; i <= lv.r[1]; i++) {
      (function(idx) {
        var ex = EX[idx];
        var item = document.createElement('div');
        var isDone = done.indexOf(idx) !== -1;
        item.className = 'exo-item' + (isDone ? ' done' : '') + (idx === cur ? ' active' : '');
        var num = document.createElement('span');
        num.className = 'exo-num';
        num.textContent = isDone ? '\u2713' : (idx + 1);
        var txt = document.createElement('span');
        txt.textContent = ex.title;
        item.appendChild(num);
        item.appendChild(txt);
        item.onclick = function() { loadEx(idx); };
        sec.appendChild(item);
      })(i);
    }
    sb.appendChild(sec);
  });
}

function loadEx(i) {
  cur = i;
  var ex = EX[i];
  hintVisible = false;
  document.getElementById('hintPanel').classList.remove('visible');
  document.getElementById('checkPanel').classList.remove('visible');
  document.getElementById('explainPanel').classList.remove('visible');
  explainVisible = false;
  document.getElementById('btnExplain').textContent = 'Explication';
  document.getElementById('exoBadge').textContent = (i < 9 ? '0' : '') + (i + 1);
  document.getElementById('exoTitle').textContent = ex.title;
  document.getElementById('exoDesc').textContent = ex.desc;
  document.getElementById('hintPanel').innerHTML = ex.hint;
  var saved = getSaved(i);
  document.getElementById('editorHTML').value = (saved.html !== undefined) ? saved.html : ex.html;
  document.getElementById('editorCSS').value = (saved.css) ? saved.css : ex.css;
  document.getElementById('btnPrev').disabled = (i === 0);
  document.getElementById('btnNext').disabled = (i === EX.length - 1);
  switchTab(activeTab);
  buildSidebar();
  updateProgress();
  runCode();
}

function getSaved(i) {
  try {
    var v = localStorage.getItem('fb-ex-' + i);
    return v ? JSON.parse(v) : {};
  } catch(e) { return {}; }
}

function saveCode(i) {
  try {
    localStorage.setItem('fb-ex-' + i, JSON.stringify({
      html: document.getElementById('editorHTML').value,
      css: document.getElementById('editorCSS').value
    }));
  } catch(e) {}
}

function runCode() {
  var html = document.getElementById('editorHTML').value;
  var css = document.getElementById('editorCSS').value;
  var doc = '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
    '<style>*{box-sizing:border-box;margin:0;padding:0;}' + css + '</style>' +
    '</head><body>' + html + '</body></html>';
  var fr = document.getElementById('preview');
  try {
    var d = fr.contentDocument || fr.contentWindow.document;
    d.open('text/html', 'replace');
    d.write(doc);
    d.close();
  } catch(e) {
    fr.srcdoc = doc;
  }
  saveCode(cur);
}

function autoRun() {
  clearTimeout(runTimer);
  runTimer = setTimeout(runCode, 500);
}

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('editorHTML').style.display = tab === 'html' ? '' : 'none';
  document.getElementById('editorCSS').style.display = tab === 'css' ? '' : 'none';
  document.getElementById('tabHTML').className = 'tab' + (tab === 'html' ? ' active' : '');
  document.getElementById('tabCSS').className = 'tab' + (tab === 'css' ? ' active' : '');
  if (tab === 'css') {
    var ta = document.getElementById('editorCSS');
    var marker = '/* Ton code ici */';
    var pos = ta.value.indexOf(marker);
    if (pos !== -1) {
      ta.focus();
      ta.setSelectionRange(pos, pos + marker.length);
    } else {
      ta.focus();
    }
  }
}

function toggleHint() {
  hintVisible = !hintVisible;
  document.getElementById('hintPanel').classList.toggle('visible', hintVisible);
}

function showSolution() {
  if (!confirm('Voir la solution ?')) return;
  var ex = EX[cur];
  document.getElementById('editorHTML').value = ex.html;
  document.getElementById('editorCSS').value = ex.sol;
  runCode();
}

function resetCode() {
  if (!confirm('Reinitialiser ?')) return;
  var ex = EX[cur];
  document.getElementById('editorHTML').value = ex.html;
  document.getElementById('editorCSS').value = ex.css;
  try { localStorage.removeItem('fb-ex-' + cur); } catch(e) {}
  runCode();
}

function markDone() {
  if (done.indexOf(cur) === -1) {
    done.push(cur);
    try { localStorage.setItem('fb-done', JSON.stringify(done)); } catch(e) {}
  }
  buildSidebar();
  updateProgress();
  if (done.length === EX.length) {
    setTimeout(showCelebration, 350);
  } else if (cur < EX.length - 1) {
    setTimeout(function() { loadEx(cur + 1); }, 200);
  }
}

// ─── CELEBRATION & CONFETTI ───
var confettiRAF = null;

function buildModals() {

    + '<div class="celeb-stats">'
    +   '<div class="celeb-stat"><span class="num">20</span><span class="lbl">Exercices</span></div>'
    +   '<div class="celeb-stat"><span class="num">4</span><span class="lbl">Niveaux</span></div>'

    + '</div>'
    + '</div>';

  // Cheat sheet overlay
  var cs = document.createElement('div');
  cs.id = 'cheatOverlay';
  cs.innerHTML = '<div class="cheat-inner">'

    +   '<h1><em>Flex</em>box \u2014 Fiche de Synth\u00e8se Compl\u00e8te</h1>'
    +   '<div style="display:flex;gap:8px">'
    +   '<button class="btn-close-cheat" onclick="printCheatSheet()" style="color:#4fc3f7;border-color:rgba(79,195,247,.4)">\ud83d\udda8\ufe0f Imprimer</button>'

    +   '<button class="btn-close-cheat" onclick="closeCheatSheet()">\u2715 Fermer</button>'

  var btnS = document.createElement('button');
  btnS.className = 'btn-hdr-synth';

  btnS.textContent = '\ud83d\udcca Synth\u00e8se';
  btnS.onclick = openCheatSheet;

function showCelebration() {
  var ov = document.getElementById('celebOverlay');
  ov.style.display = 'flex';
  var btn = document.getElementById('btnHdrSynth');
  if (btn) btn.style.display = '';
  launchConfetti();
  // Focus le premier bouton pour les utilisateurs clavier
  setTimeout(function() {
    var first = ov.querySelector('.btn-open-synth');
    if (first) first.focus();
  }, 500);
}

function closeCelebration() {
  var ov = document.getElementById('celebOverlay');
  ov.style.display = 'none';
  if (confettiRAF) { cancelAnimationFrame(confettiRAF); confettiRAF = null; }
  var c = document.getElementById('confettiCanvas');
  if (c) { var ctx = c.getContext('2d'); ctx.clearRect(0, 0, c.width, c.height); }
}

function launchConfetti() {
  var canvas = document.getElementById('confettiCanvas');
  if (!canvas) return;
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  var ctx = canvas.getContext('2d');
  var colors = ['#6c63ff','#a78bfa','#ff6584','#43d98c','#ffd166','#4fc3f7','#f9a8d4','#fb923c'];
  var pieces = [];
  for (var i = 0; i < 200; i++) {
    var circ = Math.random() > .55;
    pieces.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height * .4 - canvas.height * .4,
      w: Math.random() * 11 + 5,
      h: Math.random() * 7 + 3,
      color: colors[~~(Math.random() * colors.length)],
      vx: (Math.random() - .5) * 5,
      vy: Math.random() * 4 + 1,
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - .5) * .14,
      circ: circ
    });
  }
  var t0 = Date.now();
  function frame() {
    var elapsed = Date.now() - t0;
    var alpha = elapsed > 4500 ? Math.max(0, 1 - (elapsed - 4500) / 2000) : 1;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = alpha;
    pieces.forEach(function(p) {
      p.x += p.vx; p.y += p.vy; p.vy += .09; p.rot += p.rotV;
      if (p.y > canvas.height + 20) { p.y = -15; p.x = Math.random() * canvas.width; p.vy = Math.random() * 3 + 1; }
      ctx.save(); ctx.translate(p.x, p.y);
      if (!p.circ) ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.circ) { ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2); ctx.fill(); }
      else ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    ctx.globalAlpha = 1;
    if (elapsed < 6500) confettiRAF = requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  frame();
}

  +'<div class="gotcha-card"><div class="gotcha-title">align-items: left n\u2019existe pas</div><p>En Flexbox, les valeurs valides sont <code>flex-start</code>, <code>flex-end</code>, <code>center</code>, <code>stretch</code>, <code>baseline</code>.<br>Les navigateurs ignorent silencieusement <code>left</code> et appliquent le d\u00e9faut (<code>stretch</code>).</p></div>'

  +'<div class="gotcha-card"><div class="gotcha-title">flex-direction: column inverse les axes</div><p>Quand <code>flex-direction: column</code>, <code>justify-content</code> contr\u00f4le le <strong>vertical</strong> et <code>align-items</code> contr\u00f4le l\u2019<strong>horizontal</strong>. L\u2019inverse de <code>row</code>.</p></div>'

  +'<div class="gotcha-card"><div class="gotcha-title">align-content vs align-items</div><p><code>align-items</code> = alignement sur une seule ligne.<br><code>align-content</code> = r\u00e9partition de plusieurs lignes.<br><code>align-content</code> n\u2019a aucun effet sans <code>flex-wrap: wrap</code> ET plusieurs lignes.</p></div>'

  +'<div class="gotcha-card"><div class="gotcha-title">flex: 1 et flex-basis: 0</div><p><code>flex: 1</code> = <code>flex-basis: 0</code>, pas <code>auto</code>. L\u2019espace est divis\u00e9 depuis 0.<br>Si tu veux que la taille naturelle du contenu soit la base, utilise <code>flex: auto</code> = <code>flex: 1 1 auto</code>.</p></div>'

  +'<div class="gotcha-card"><div class="gotcha-title">flex-shrink: 1 par d\u00e9faut</div><p>Tous les items peuvent r\u00e9tr\u00e9cir par d\u00e9faut. Si tu veux qu\u2019un item garde sa taille fixe, ajoute <code>flex-shrink: 0</code> explicitement (ex\u00a0: sidebar, bouton dans une barre).</p></div>'

  +'<div class="gotcha-card"><div class="gotcha-title">gap ne cr\u00e9e pas d\u2019espace aux bords</div><p><code>gap</code> = espace <em>entre</em> les items uniquement. Pour de l\u2019espace aux bords, utilise <code>padding</code> sur le conteneur. C\u2019est un avantage par rapport \u00e0 <code>margin</code> sur les enfants.</p></div>'

  +'<div class="gotcha-card"><div class="gotcha-title">flex ne s\u2019applique qu\u2019aux enfants directs</div><p>Seuls les <em>enfants directs</em> d\u2019un flex container deviennent des flex items. Les petits-enfants ne sont pas affect\u00e9s \u2014 il faut cr\u00e9er un nouveau <code>display: flex</code> pour chaque niveau.</p></div>'

  +'<div class="gotcha-card"><div class="gotcha-title">Text overflow dans un item flex</div><p>Par d\u00e9faut, <code>min-width: auto</code> emp\u00eache un item de r\u00e9tr\u00e9cir en dessous de son contenu.<br>Pour forcer le r\u00e9tr\u00e9cissement + text-overflow, ajoute <code>min-width: 0</code> sur l\u2019item.</p></div>'

  +'</div></div>';
}

// ── CSS CHECKER ──
function normVal(v) {
  return v.replace(/\s+/g, ' ').trim().toLowerCase();
}

// D\u00e9compose flex: X Y Z en { grow, shrink, basis }
function expandFlexValue(val) {
  val = normVal(val);
  if (val === 'none')  return { grow: '0', shrink: '0', basis: 'auto' };
  if (val === 'auto')  return { grow: '1', shrink: '1', basis: 'auto' };
  var parts = val.split(/\s+/);
  var grow = '1', shrink = '1', basis = '0';
  if (parts.length === 1) {
    if (/^[\d.]/.test(parts[0])) { grow = parts[0]; }
    else { basis = parts[0]; }
  } else if (parts.length === 2) {
    grow = parts[0];
    if (/^[\d.]+$/.test(parts[1])) { shrink = parts[1]; }
    else { basis = parts[1]; }
  } else {
    grow = parts[0]; shrink = parts[1]; basis = parts.slice(2).join(' ');
  }
  return { grow: grow, shrink: shrink, basis: basis };
}

// Compare une propri\u00e9t\u00e9 solution vs les props de l\u2019utilisateur
// Accepte shorthand flex ET longhands \u00e9quivalents
function propMatches(solProp, solVal, userProps) {
  // Correspondance directe
  if (userProps[solProp] !== undefined && normVal(userProps[solProp]) === normVal(solVal)) return true;

  // Shorthand flex de la solution → accepter les longhands \u00e9quivalents
  if (solProp === 'flex') {
    var se = expandFlexValue(solVal);
    // Utilisateur a \u00e9crit les trois longhands s\u00e9par\u00e9ment ?
    var ug = userProps['flex-grow'], us = userProps['flex-shrink'], ub = userProps['flex-basis'];
    if (ug !== undefined && us !== undefined && ub !== undefined) {
      return normVal(ug) === se.grow && normVal(us) === se.shrink && normVal(ub) === se.basis;
    }
    // Utilisateur a \u00e9crit un shorthand diff\u00e9rent qui \u00e9quivaut ?
    if (userProps['flex']) {
      var ue = expandFlexValue(userProps['flex']);
      return ue.grow === se.grow && ue.shrink === se.shrink && ue.basis === se.basis;
    }
  }

  // Longhand flex-grow/shrink/basis de la solution → accepter le shorthand \u00e9quivalent
  if ((solProp === 'flex-grow' || solProp === 'flex-shrink' || solProp === 'flex-basis') && userProps['flex']) {
    var ue2 = expandFlexValue(userProps['flex']);
    if (solProp === 'flex-grow')   return normVal(solVal) === ue2.grow;
    if (solProp === 'flex-shrink') return normVal(solVal) === ue2.shrink;
    if (solProp === 'flex-basis')  return normVal(solVal) === ue2.basis;
  }

  return false;
}

function parseCSSRules(css) {
  css = css.replace(/\/\*[\s\S]*?\*\//g, '');
  var rules = {};

  // Extract @media blocks with brace counting
  var mediaBlocks = [];
  var cleanCSS = css;
  var offsets = [];
  var searchPos = 0;
  while (true) {
    var mi = cleanCSS.indexOf('@media', searchPos);
    if (mi === -1) break;
    var openBrace = cleanCSS.indexOf('{', mi);
    if (openBrace === -1) break;
    var cond = cleanCSS.slice(mi + 6, openBrace).trim();
    var depth = 1, i = openBrace + 1;
    while (i < cleanCSS.length && depth > 0) {
      if (cleanCSS[i] === '{') depth++;
      else if (cleanCSS[i] === '}') depth--;
      i++;
    }
    mediaBlocks.push({ cond: cond, inner: cleanCSS.slice(openBrace + 1, i - 1) });
    offsets.push([mi, i]);
    searchPos = i;
  }
  // Remove @media blocks from cleanCSS (reverse order)
  offsets.reverse().forEach(function(r) {
    cleanCSS = cleanCSS.slice(0, r[0]) + cleanCSS.slice(r[1]);
  });

  // Parse regular rules
  var re = /([^{}@]+)\{([^}]*)\}/g, m;
  while ((m = re.exec(cleanCSS)) !== null) {
    addCSSRule(rules, m[1].trim(), m[2]);
  }

  // Parse rules inside @media blocks
  mediaBlocks.forEach(function(mb) {
    var re2 = /([^{}]+)\{([^}]*)\}/g, m2;
    while ((m2 = re2.exec(mb.inner)) !== null) {
      addCSSRule(rules, '@media ' + mb.cond + ' | ' + m2[1].trim(), m2[2]);
    }
  });

  return rules;
}

function addCSSRule(rules, selector, declBlock) {
  selector = selector.replace(/\s+/g, ' ').trim();
  if (!selector) return;
  rules[selector] = rules[selector] || {};
  declBlock.split(';').forEach(function(d) {
    d = d.trim();
    if (!d) return;
    var c = d.indexOf(':');
    if (c === -1) return;
    var prop = d.slice(0, c).trim().toLowerCase();
    var val = normVal(d.slice(c + 1));
    if (prop) rules[selector][prop] = val;
  });
}

function checkAnswer() {
  var panel = document.getElementById('checkPanel');
  // Toggle off if already showing
  if (panel.classList.contains('visible')) {
    panel.classList.remove('visible');
    return;
  }

  var ex = EX[cur];
  var userCSS = document.getElementById('editorCSS').value;
  var solRules = parseCSSRules(ex.sol);
  var userRules = parseCSSRules(userCSS);

  var total = 0, correct = 0;
  // Collect results grouped by selector
  var grouped = [];

  Object.keys(solRules).forEach(function(sel) {
    var solProps = solRules[sel];
    var selNorm = sel.replace(/\s+/g, ' ').trim();
    var userSel = null;
    Object.keys(userRules).forEach(function(us) {
      if (us.replace(/\s+/g, ' ').trim() === selNorm) userSel = us;
    });
    var userProps = userSel ? userRules[userSel] : {};
    var rows = [];

    Object.keys(solProps).forEach(function(prop) {
      total++;
      var expected = solProps[prop];
      // Ce que l'utilisateur a \u00e9crit (shorthand ou longhand)
      var actual = null;
      if (userProps[prop] !== undefined) {
        actual = normVal(userProps[prop]);
      } else if (prop === 'flex' && (userProps['flex-grow'] || userProps['flex-shrink'] || userProps['flex-basis'])) {
        actual = 'flex-grow: ' + (userProps['flex-grow']||'?') + '; flex-shrink: ' + (userProps['flex-shrink']||'?') + '; flex-basis: ' + (userProps['flex-basis']||'?');
      }
      var ok = propMatches(prop, expected, userProps);
      if (ok) correct++;
      rows.push({ prop: prop, expected: expected, actual: actual, ok: ok });
    });

    if (rows.length) grouped.push({ sel: sel, rows: rows });
  });

  var allOk = correct === total;
  var html = '';

  if (allOk) {
    html = '<span class="check-ok" style="font-size:.9rem">&#10003;&#10003; Parfait ! Toutes les propri\u00e9t\u00e9s sont correctes (' + total + '/' + total + ')</span>';
  } else {
    html = '<div class="check-summary" style="color:' + (allOk ? 'var(--green)' : 'var(--accent2)') + ';margin-bottom:8px">'
      + (allOk ? '&#10003;' : '&#10007;') + ' ' + correct + '\u00a0/\u00a0' + total + ' propri\u00e9t\u00e9s correctes</div>';

    grouped.forEach(function(g) {
      var selEsc = g.sel.replace(/</g, '&lt;').replace(/>/g, '&gt;');
      html += '<div style="margin-bottom:6px"><span style="color:#7b85a5;font-size:.75rem;text-transform:uppercase;letter-spacing:.5px">' + selEsc + '</span>';
      g.rows.forEach(function(r) {
        if (r.ok) {
          html += '<div class="check-ok" style="padding-left:10px;font-size:.8rem">&#10003; <code>' + r.prop + ': ' + r.expected + '</code></div>';
        } else if (r.actual) {
          html += '<div class="check-err" style="padding-left:10px;font-size:.8rem">&#10007; <code>' + r.prop + '</code> : tu as <code>' + r.actual + '</code> &rarr; attendu <code>' + r.expected + '</code></div>';
        } else {
          html += '<div class="check-err" style="padding-left:10px;font-size:.8rem">&#10007; <code>' + r.prop + '</code> manquant &mdash; attendu <code>' + r.expected + '</code></div>';
        }
      });
      html += '</div>';
    });
  }

  panel.innerHTML = html;
  panel.classList.add('visible');
}

var explainVisible = false;
function toggleExplain() {
  var panel = document.getElementById('explainPanel');
  var btn = document.getElementById('btnExplain');
  explainVisible = !explainVisible;
  if (explainVisible) {
    panel.innerHTML = EXPLAIN[cur] || '<em>Pas encore d\u2019explication pour cet exercice.</em>';
    panel.classList.add('visible');
    btn.textContent = '\u25b2 Fermer';
  } else {
    panel.classList.remove('visible');
    btn.textContent = 'Explication';
  }
}

function navigate(dir) {
  var n = cur + dir;
  if (n >= 0 && n < EX.length) loadEx(n);
}

function updateProgress() {
  var pct = (done.length / EX.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = done.length + ' / ' + EX.length;
}

// Tab key in editors
var tas = document.querySelectorAll('textarea');
for (var ti = 0; ti < tas.length; ti++) {
  tas[ti].addEventListener('keydown', function(e) {
    if (e.key !== 'Tab') return;
    e.preventDefault();
    var ta = e.target, s = ta.selectionStart;
    ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(ta.selectionEnd);
    ta.selectionStart = ta.selectionEnd = s + 2;
    autoRun();
  });
}

// Expose globals for onclick + oninput handlers
window.navigate = navigate;
window.toggleHint = toggleHint;
window.showSolution = showSolution;
window.checkAnswer = checkAnswer;
window.toggleExplain = toggleExplain;
window.resetCode = resetCode;
window.markDone = markDone;
window.switchTab = switchTab;
window.runCode = runCode;
window.autoRun = autoRun; // requis par oninput="autoRun()" dans les textareas
window.closeCelebration = closeCelebration;
window.openCheatSheet = openCheatSheet;
window.closeCheatSheet = closeCheatSheet;
window.printCheatSheet = printCheatSheet;

// Raccourcis clavier globaux
document.addEventListener('keydown', function(e) {
  // Ctrl+Enter = Run
  if (e.ctrlKey && e.key === 'Enter') {
    e.preventDefault();
    runCode();
  }
  // Echap = fermer tous les panneaux et modaux
  if (e.key === 'Escape') {
    var cheat = document.getElementById('cheatOverlay');
    if (cheat && cheat.classList.contains('open')) { closeCheatSheet(); return; }
    var celeb = document.getElementById('celebOverlay');
    if (celeb && celeb.style.display !== 'none' && celeb.style.display !== '') { closeCelebration(); return; }
    document.getElementById('hintPanel').classList.remove('visible');
    document.getElementById('checkPanel').classList.remove('visible');
    if (explainVisible) toggleExplain();
    hintVisible = false;
  }
});

window.addEventListener('DOMContentLoaded', init);

})();
</script>
